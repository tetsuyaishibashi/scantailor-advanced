# Windows build of ScanTailor Advanced (MSYS2 / MinGW-w64, Qt6)
# 置き場所: フォークしたリポジトリの .github/workflows/build-windows.yml
# 実行方法: Actions タブ → "Build Windows" → Run workflow
name: Build Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build"
        default: "v1.2.1"
        required: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-translations
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-zlib
            zip

      # CMakeLists.txt は Release ビルドに -march=native を付ける。
      # GitHub のサーバーの CPU 専用の命令が混ざり、他の PC で起動しなくなるのを避けるため外す。
      - name: Remove -march=native
        run: |
          sed -i 's/-march=native;-mtune=native/-mtune=generic/' CMakeLists.txt
          grep -n "mtune" CMakeLists.txt

      # cmake/CopyToBuildDir.cmake が実行ファイルのターゲット名を "scantailor" と固定している。
      # 実際の名前は "scantailor-advanced" なので、Windows ビルドの設定段階でエラーになる。それを直す。
      - name: Fix target name in CopyToBuildDir.cmake
        run: |
          sed -i 's/TARGET_FILE_DIR:scantailor>/TARGET_FILE_DIR:scantailor-advanced>/' cmake/CopyToBuildDir.cmake
          grep -n "TARGET_FILE_DIR" cmake/CopyToBuildDir.cmake

      - name: Configure
        run: |
          cmake -G Ninja -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBOOST_ROOT="$(cygpath -m /mingw64)"

      - name: Build
        run: cmake --build build

      - name: Install and deploy Qt
        run: |
          cmake --install build --prefix "$PWD/dist"
          ls -la dist
          WDQ=$(ls /mingw64/bin | grep -i '^windeployqt' | head -1)
          echo "using $WDQ"
          "/mingw64/bin/$WDQ" --release --no-translations dist/scantailor-advanced.exe || true
          ls -la dist

      # CMake の DLL 収集は、MSYS2 の DLL 名（libjpeg-8.dll など）と合わず、
      # JPEG/PNG/TIFF/zlib の DLL が入らない。ldd で依存 DLL を調べ、まとめてコピーする。
      - name: Bundle dependent DLLs
        run: |
          for f in $(find dist -type f \( -name '*.exe' -o -name '*.dll' \)); do
            ldd "$f" | grep -i '/mingw64/bin/' | awk '{print $3}'
          done | sort -u | while read -r d; do
            cp -n "$d" dist/
          done
          # コピーした DLL がさらに必要とする DLL も拾う（2周目）
          for f in $(find dist -maxdepth 1 -type f -name '*.dll'); do
            ldd "$f" | grep -i '/mingw64/bin/' | awk '{print $3}'
          done | sort -u | while read -r d; do
            cp -n "$d" dist/
          done
          echo "--- dist contents ---"
          find dist -type f | sort
          echo "--- missing dependencies (should be empty) ---"
          for f in $(find dist -type f \( -name '*.exe' -o -name '*.dll' \)); do
            ldd "$f" | grep -i 'not found' || true
          done

      - name: Package
        run: |
          mv dist ScanTailor-Advanced-${{ inputs.ref }}-win64
          zip -r ScanTailor-Advanced-${{ inputs.ref }}-win64.zip ScanTailor-Advanced-${{ inputs.ref }}-win64
          sha256sum ScanTailor-Advanced-${{ inputs.ref }}-win64.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ScanTailor-Advanced-${{ inputs.ref }}-win64
          path: ScanTailor-Advanced-${{ inputs.ref }}-win64.zip
